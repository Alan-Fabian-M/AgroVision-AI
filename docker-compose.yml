version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agrovision_postgres
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agrovision_network

  neo4j:
    image: neo4j:5.12-community
    container_name: agrovision_neo4j
    restart: always
    ports:
      - "7474:7474" # Neo4j Browser (Consola Web HTTP)
      - "7687:7687" # Protocolo Bolt (Usado por la app)
    environment:
      - NEO4J_AUTH=neo4j/password
      # - NEO4J_PLUGINS=["apoc"] # Opcional: Descomentar si se necesitan procedimientos APOC avanzados en el futuro
    volumes:
      - neo4j_data:/data
      - neo4j_import:/import
      - neo4j_logs:/logs
    networks:
      - agrovision_network

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_import:
    driver: local
  neo4j_logs:
    driver: local

networks:
  agrovision_network:
    driver: bridge
